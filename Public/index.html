<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SG Lucky VAULT — Private Access</title>
<link rel="stylesheet" href="/style.css">
</head>

<body class="lux">

<main class="card login-card">

<div class="brand">SG <span>LUCKY</span> VAULT</div>

<div class="eyebrow">PRIVATE CUSTOMER PORTAL</div>

<h1>Secure Number Access</h1>

<p class="muted">
Enter your individual customer reference and password.
</p>

<form id="login">

<label>
Customer Reference
<input name="ref" placeholder="SV-XXXXXXXX" required>
</label>

<label>
Password
<input type="password" name="password"
placeholder="Enter password" required>
</label>

<div id="error" class="alert"></div>

<button type="submit">
Enter Private Portal
</button>

</form>

<p class="fine">
Independent private service. Not affiliated with or endorsed by Singapore Pools.
</p>

</main>

<script>

document.getElementById("login").addEventListener("submit", async function(e){

e.preventDefault();

const error=document.getElementById("error");

error.textContent="";
error.classList.remove("show");

const response=await fetch("/api/customer/login",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:new URLSearchParams(new FormData(this))
});

const data=await response.json();

if(data.ok){

window.location.href="/portal.html";

}else{

error.textContent=
data.message ||
"Wrong password. Please enter the correct password.";

error.classList.add("show");

}

});

</script>

</body>
</html>
