<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Customer Portal</title><link rel="stylesheet" href="/style.css"></head><body><main class="center"><section class="card"><div class="brand">SG LUCKY VAULT</div><div class="eyebrow">PRIVATE CUSTOMER ACCESS</div><h1>Welcome</h1><p class="muted">Enter the username and password provided to you.</p><form id="f"><label>Username</label><input id="u" required><label>Password</label><input id="p" type="password" required><button>Enter Private Portal</button><p id="m" class="message"></p></form><p class="disclaimer">Independent private customer portal. Not affiliated with or operated by Singapore Pools.</p></section></main><script>const t=new URLSearchParams(location.search).get("token")||"";f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/customer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:u.value,password:p.value,token:t})}),d=await r.json().catch(()=>({}));if(!r.ok)m.textContent=d.error||"Login failed.";else location.href="/portal.html"}</script></body></html>
