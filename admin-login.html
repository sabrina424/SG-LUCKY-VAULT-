<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/style.css"></head><body><main class="center"><section class="card"><div class="brand">SG LUCKY VAULT</div><div class="eyebrow">ADMIN ACCESS</div><h1>Dashboard Login</h1><form id="f"><label>Admin Password</label><input id="p" type="password" required><button>Open Dashboard</button><p id="m" class="message"></p></form></section></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p.value})}),d=await r.json().catch(()=>({}));if(!r.ok)m.textContent=d.error||"Login failed.";else location.href="/admin.html"}</script></body></html>
